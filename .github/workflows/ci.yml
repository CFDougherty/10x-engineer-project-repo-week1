name: CI

on:
  push:
    branches:
      - postgres-migration
  pull_request:
    branches:
      - postgres-migration

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.10'
          - '3.11'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: promptlab
          POSTGRES_PASSWORD: promptlab
          POSTGRES_DB: promptlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://promptlab:promptlab@localhost:5432/promptlab_test
        run: |
          cd backend
          pytest -v
