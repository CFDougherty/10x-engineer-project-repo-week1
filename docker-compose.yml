services:
  db:
    image: pgvector/pgvector:pg16
    container_name: promptlab_db
    environment:
      POSTGRES_USER: promptlab
      POSTGRES_PASSWORD: promptlab
      POSTGRES_DB: promptlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptlab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: promptlab_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://promptlab:promptlab@db:5432/promptlab
      - API_KEY=${API_KEY:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/main.py:/app/main.py
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_KEY=${API_KEY:-}
    container_name: promptlab_frontend
    environment:
      - API_KEY=${API_KEY:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  huggingface_cache:
